<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal 21 — Arcade Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Royal 21 game world"></canvas>
<div id="hud">
  <div class="brand">♠ <span>ROYAL</span> <b>21</b></div>
  <div class="stats">
    <span>⭐ LV <b id="level">1</b></span>
    <span>XP <b id="xp">0</b></span>
    <span>🏆 <b id="score">0</b></span>
  </div>
</div>
<div id="help">
  <b>WASD / Arrow Keys</b> Move &nbsp; • &nbsp; <b>E</b> Play &nbsp; • &nbsp; <b>ESC</b> Leave
</div>
<div id="prompt" class="hidden"></div>
<div id="menu" class="hidden"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
