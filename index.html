<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Palace Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="hud"><span>$<b id="m">5</b></span><span>LVL <b id="l">1</b></span><div id="bar"><i id="xb"></i></div><span>XP <b id="x">0</b></span></div>
<canvas id="c" width="640" height="400" aria-label="Arcade game"></canvas>
<div id="ctl"><div id="pad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div><button id="act">ENTER</button><button id="bk">BACK</button></div>
<div id="help">Arrows/WASD: walk. E: enter a cabinet. Space: act in a game or buy. Esc: leave. Keys 1-4 / 1-9 in Simon and Whack.</div>
<script src="script.js"></script></body></html>
