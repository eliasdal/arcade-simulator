<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Royal 21 — Arcade District</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div class="brand"><span class="brand-mark">♠</span><span>ROYAL 21</span><small>ARCADE DISTRICT</small></div>
    <div class="stats">
      <div><span>LEVEL</span><b id="level">1</b></div>
      <div><span>XP</span><b id="xp">0</b></div>
      <div><span>SCORE</span><b id="score">0</b></div>
    </div>
  </div>

  <canvas id="game" aria-label="Royal 21 free-roaming arcade game"></canvas>

  <div id="miniHelp">
    <span><kbd>WASD</kbd> / <kbd>ARROWS</kbd> Move</span>
    <span><kbd>E</kbd> Interact</span>
    <span><kbd>ESC</kbd> Leave game</span>
  </div>

  <div id="interaction">
    <strong id="interactionKey">E</strong>
    <span id="interactionText">PLAY</span>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="modal" class="hidden">
    <div id="modalBox">
      <button id="close" aria-label="Close game">×</button>
      <div class="modal-eyebrow">ARCADE CHALLENGE</div>
      <h2 id="gameTitle"></h2>
      <div id="gameContent"></div>
    </div>
  </div>

  <div id="mapHint">ROYAL 21 • FREE ROAM • NO BETTING</div>
  <script src="app.js"></script>
</body>
</html>
