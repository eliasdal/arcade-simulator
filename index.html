<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal 21 — Free Roam Casino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="world" width="1100" height="650"></canvas>
  <div id="hud">
    <div class="hud-left">
      <div class="brand">♠ <b>ROYAL</b> <strong>21</strong></div>
      <div class="stat"><span>CHIPS</span><b id="balance">10,000</b></div>
      <div class="stat"><span>LVL</span><b id="level">1</b></div>
      <div class="xp"><div id="xpbar"></div></div>
    </div>
    <div class="hud-right">
      <button id="soundBtn" class="hud-btn">🔊</button>
      <button id="helpBtn" class="hud-btn">?</button>
    </div>
  </div>
  <div id="hint" class="hint">WASD / Arrow Keys to move</div>
  <div id="interaction" class="interaction hidden"><b id="interactionTitle">ARCADE</b><span id="interactionText">Press E to play</span></div>
  <div id="toast"></div>
  <div id="modal"></div>
</div>
<script src="app.js"></script>
</body>
</html>
