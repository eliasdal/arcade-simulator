<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal 21 — Arcade District 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading"><div class="loaderLogo">♠ ROYAL 21</div><div class="loaderBar"><i></i></div><small>LOADING ARCADE DISTRICT</small></div>

<div id="hud">
  <div class="brand"><b>♠</b><span>ROYAL 21</span><small>ARCADE DISTRICT</small></div>
  <div class="hudRight">
    <div><div>LEVEL</div><b id="level">1</b></div>
    <div><div>XP</div><b id="xp">0</b></div>
    <div><div>SCORE</div><b id="score">0</b></div>
  </div>
</div>

<div id="crosshair"></div>
<div id="prompt"><kbd>E</kbd><span id="promptText">PLAY</span></div>
<div id="controls"><b>WASD</b> MOVE &nbsp; <b>MOUSE</b> LOOK &nbsp; <b>E</b> INTERACT &nbsp; <b>ESC</b> RELEASE MOUSE</div>
<div id="location">ROYAL 21 • MAIN ARCADE</div>
<div id="toast"></div>

<div id="gameModal" class="hidden">
  <div class="gameCard">
    <button id="closeGame">×</button>
    <small>ARCADE CHALLENGE</small>
    <h2 id="gameName"></h2>
    <div id="gameBody"></div>
  </div>
</div>

<canvas id="game"></canvas>
<script type="module" src="app.js"></script>
</body>
</html>
